# Deploys the static prototype to GitHub Pages (project site).
# No secrets, no API keys, minimal permissions. Created in stage 5 but intentionally not
# exercised remotely until the release stage is explicitly approved.
name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Format check
        working-directory: app
        run: npm run format:check
      - name: Test
        working-directory: app
        run: npm test
      - name: Audit production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      # development tooling (test runner, dev server) does not ship in the static site, so its
      # advisories are reported on every run for review rather than blocking a release
      - name: Audit all dependencies (reported in the run summary)
        working-directory: app
        run: |
          {
            echo '### Dependency audit, development and production'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        working-directory: app
        run: npm run build
      # the browser suite runs on the built site before it is published: every route at desktop
      # and three phone widths, accessibility scans, and the CIO flows (audit, September 18, 2026)
      - name: Install the test browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: app
        run: npx playwright test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
